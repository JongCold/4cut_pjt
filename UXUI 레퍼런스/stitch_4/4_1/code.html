<script data-purpose="toggle-handling">
    // Interactive film tone toggle handler
    const bwBtn = document.getElementById('tone-bw-btn');
    const colorBtn = document.getElementById('tone-color-btn');

    bwBtn.addEventListener('click', () => {
      bwBtn.classList.add('bg-ink', 'text-white', 'shadow-sm');
      bwBtn.classList.remove('text-[#666]');
      
      colorBtn.classList.remove('bg-ink', 'text-white', 'shadow-sm');
      colorBtn.classList.add('text-[#666]');
    });

    colorBtn.addEventListener('click', () => {
      colorBtn.classList.add('bg-ink', 'text-white', 'shadow-sm');
      colorBtn.classList.remove('text-[#666]');
      
      bwBtn.classList.remove('bg-ink', 'text-white', 'shadow-sm');
      bwBtn.classList.add('text-[#666]');
    });
  </script>
